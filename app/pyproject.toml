[project]
name = "hagent-app"
version = "0.0.0"
description = "hagent app: runtime for persistent Home Assistant agents."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13",
    "genai-prices>=0.2.3",
    "httpx2>=2.16",
    "pydantic-ai-slim[openai,openrouter]>=2.68",
]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hagent_app"
