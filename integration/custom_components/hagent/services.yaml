invoke:
  target:
    device:
      integration: hagent
    entity:
      integration: hagent
  fields:
    data:
      required: false
      example: '{"reason": "window opened"}'
      selector:
        object:
    wait:
      required: false
      default: true
      selector:
        boolean:
    timeout:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    on_timeout:
      required: false
      selector:
        select:
          options:
            - cancel
            - continue
