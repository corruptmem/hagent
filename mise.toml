# Tool versions for hagent. Run `mise install`, then `mise run setup`.
# Python is managed by uv (see .python-version), not by mise.

[tools]
uv = "0.13.0"
# The front-end package manager. package.json names the same version.
# It comes before node, so that it takes precedence over the npm of node.
"npm:npm" = "11.17.0"
node = "24"
"npm:backlog.md" = "1.49.3"
"pipx:pre-commit" = "4.7.0"

[tasks.setup]
description = "Install dependencies and git hooks"
run = [
  "uv sync --all-packages",
  "uv sync --project integration",
  "UV_PROJECT_ENVIRONMENT=.venv-ha2611 uv sync --project integration --no-default-groups --group ha2611",
  "npm ci --prefix frontend",
  "pre-commit install",
]

[tasks.lint]
description = "Lint and check formatting"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.format]
description = "Apply formatting and safe lint fixes"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.typecheck]
description = "Static type checking"
run = "uv run mypy"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

# The HA integration has its own uv project (integration/pyproject.toml),
# because HA Core pins conflict with the app. Two environments:
# integration/.venv (HA Core 2026.10.4 with pytest-homeassistant-custom-
# component) and integration/.venv-ha2611 (HA Core 2026.11.1, for mypy and
# the EVALUATE tests).
[tasks.test-integration]
description = "Integration tests against HA Core in memory"
dir = "integration"
run = [
  "uv run pytest",
  "UV_PROJECT_ENVIRONMENT=.venv-ha2611 uv run --no-default-groups --group ha2611 pytest tests_ha2611",
]

[tasks.typecheck-integration]
description = "Static type checking of the integration (HA Core 2026.11.1)"
dir = "integration"
run = "UV_PROJECT_ENVIRONMENT=.venv-ha2611 uv run --no-default-groups --group ha2611 mypy"

[tasks.frontend]
description = "Front end: eslint, prettier, tsc and vitest"
dir = "frontend"
run = "npm run check"

[tasks.frontend-build]
description = "Build the management UI into frontend/dist"
dir = "frontend"
run = "npm run build"

[tasks.check]
description = "Run every check that CI and pre-commit run"
depends = [
  "lint",
  "typecheck",
  "test",
  "typecheck-integration",
  "test-integration",
  "frontend",
]
